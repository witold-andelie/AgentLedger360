[project]
name = "agentledger"
version = "0.1.0"
description = "AgentLedger 360: agents discover, pay for and dispute market-intelligence services; every event feeds a SQL analytics layer."
readme = "README.md"
# Hard requirement: every module must run on CPython 3.11 AND 3.13.
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "numpy>=2.1",       # first release with 3.13 wheels
    "pandas>=2.2.3",    # first release with 3.13 wheels
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.5.2"]            # optional ML signal seller
data = ["yfinance>=0.2.50"]             # optional real prices (synthetic fallback otherwise)
agent = [                               # LangGraph agents (buyer + guardian), multi-provider
    "langgraph>=1.0", "langchain-core>=1.0",
    "langchain-mistralai>=1.0", "langchain-anthropic>=1.0", "langchain-openai>=1.0",
]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
# Ruff reports syntax that does not exist on 3.11 (e.g. PEP 695 `type X = ...`).
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]
