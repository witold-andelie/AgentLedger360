# Render Blueprint - https://render.com/docs/blueprint-spec
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
#
# One web service does everything: dashboard + API + clearing house + AI agents + in-process sellers.
# Its onrender.com URL may carry a random suffix (agentledger.onrender.com belongs to another project) -
# copy the real URL from the service page.
# Free plan notes: the service sleeps after ~15 min idle (open /api/health before the pitch); the disk is
# ephemeral, so the SQLite ledger resets on every deploy/restart - fine for a demo. Pushing to main redeploys.
#
# Two-host mode (optional, not deployed): run a second service from the same image with AL_ROLE=sellers and
# AL_SELLER_PUBLIC_URL=<its own URL>, then set AL_SELLER_URL on this service to that URL.

envVarGroups:
  - name: agentledger-shared
    envVars:
      - key: AL_PAYMENT_SECRET      # receipts are signed and verified with this
        generateValue: true
      - key: AL_DATA_SOURCE
        value: synthetic

services:
  - type: web
    name: agentledger
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - fromGroup: agentledger-shared
      - key: AL_ROLE
        value: all
      - key: AL_SELLER_URL          # leave empty: sellers run in-process (only set it for two-host mode)
        sync: false
      # AI agents (buyer + guardian). Without a key the service falls back to the rule-based agents.
      - key: AL_AGENT_MODE          # set to "rule" between demos so public visitors cannot spend LLM credit
        value: auto
      - key: AL_LLM_PROVIDER        # mistral | anthropic | openai_compat
        value: mistral
      - key: MISTRAL_API_KEY        # secret: Render prompts for it, never committed
        sync: false
      - key: AL_AGENT_MAX_COST_USD  # hard cost cap per agent run
        value: "0.50"
      - key: AL_ADMIN_TOKEN         # required by the "Reset demo" button on the public URL (see it in the dashboard)
        generateValue: true
      - key: AL_DAILY_AI_BUDGET_USD # past this, public rounds fall back to the rule agent
        value: "2.00"
      - key: AL_CAP_OPEN_FUNDING    # public signup must not mint money
        value: "0"
      - key: AL_CAP_MAX_ORDER_MINOR
        value: "500"
